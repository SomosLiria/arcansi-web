<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8796FF" />

    <!-- SEO básico -->
    <title>Arcansi · Consultoría empresarial pragmática para pymes</title>
    <meta
      name="description"
      content="Consultoría empresarial pragmática para dirigentes de pymes: organización, control financiero, procesos de producción, logística, compras y estrategia comercial."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://arcansi.com/" />
    <meta name="author" content="Arcansi" />

    <!-- Open Graph / redes -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Arcansi" />
    <meta property="og:url" content="https://arcansi.com/" />
    <meta property="og:title" content="Arcansi · Consultoría empresarial pragmática para pymes" />
    <meta
      property="og:description"
      content="Ayudo a dirigentes de pymes a ordenar su empresa: estructura, finanzas, procesos, compras y ventas."
    />
    <meta property="og:image" content="https://arcansi.com/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Datos estructurados (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Arcansi",
        "url": "https://arcansi.com/",
        "email": "consultoria@arcansi.com",
        "description": "Consultoría empresarial pragmática para dirigentes de pymes.",
        "areaServed": { "@type": "Country", "name": "España" },
        "knowsLanguage": "es",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servicios de consultoría",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Organización y estructura" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Control financiero" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Gestión y dirección" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Procesos de producción" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Logística y compras" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Estrategia comercial" } }
          ]
        }
      }
    </script>

    <!-- iconos -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Arcansi · Consultoría empresarial pragmática para pymes</h1>
      <p>Organización, control financiero, procesos, logística y estrategia comercial. Contacto: consultoria@arcansi.com</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
